[build-system]
requires = ["setuptools>=58.0.4", "wheel>=0.42.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-news-classification"
version = "1.0.0"
description = "Klasifikasi Artikel Berita Berbahasa Arab berbasis Medan Makna (Semantic Field) dan Frame Semantik (Frame Semantics)"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Maulana Ihsan Ahmad" },
]
dependencies = [
    "scikit-learn>=1.1.1,<1.2",
    "pandas==2.1.3",
    "numpy==1.26.2",
    "scipy==1.11.3",
    "joblib==1.3.2",
    "nltk==3.8.1",
    "Arabic-Stopwords==0.4.3",
    "PyArabic==0.6.15",
    "arabic-reshaper==3.0.0",
    "python-bidi==0.4.2",
    "wordcloud==1.9.3",
    "matplotlib==3.8.2",
    "seaborn==0.13.2",
    "psutil==5.9.8",
    "tqdm==4.66.1",
    "Pillow==10.1.0",
    "streamlit>=1.32.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/moel-ihsan/arabic_news_classification"
Repository = "https://github.com/moel-ihsan/arabic_news_classification"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
